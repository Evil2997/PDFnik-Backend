[project]
name = "pdfnik-pdf-service"
version = "0.1.0"
description = "PDF generation and audio transcription service for PDFnik ecosystem"
requires-python = ">=3.13"

dependencies = [
    "fastapi==0.127.1",
    "uvicorn==0.40.0",
    "pillow==12.1.1",
    "reportlab==4.4.7",
    "faster-whisper==1.2.1",
    "yt-dlp==2026.3.3",
    "faststream[rabbit]==0.6.3",
    "pydantic==2.11.10",
    "pydantic-settings==2.11.0",
    "pdfnik-schemes @ git+https://github.com/Evil2997/PDFnik-Schemes@v1.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "coverage>=7.6.0",
    "ruff>=0.4.10",
    "pre-commit>=3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["main_app"]

[tool.hatch.metadata]
allow-direct-references = true

# ---------------------------------------------------------------------------
# uv
# ---------------------------------------------------------------------------

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "coverage>=7.6.0",
    "ruff>=0.4.10",
    "pre-commit>=3.7.0",
    "detect-secrets>=1.5.0",
]

[tool.uv.sources]
pdfnik-schemes = { workspace = true }

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py313"
# Не трогаем файлы которые не наши
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "F", # pyflakes
    "I", # isort
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "SIM", # flake8-simplify
    "C4", # flake8-comprehensions
    "RUF", # ruff-specific rules
]
ignore = [
    "E501", # line too long — контролируется formatter
    "B008", # do not perform function calls in default arguments (FastAPI зависимости)
    "SIM108", # ternary operator — иногда if/else читабельнее
]

[tool.ruff.lint.isort]
known-first-party = ["main_app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:reportlab",
    "ignore::DeprecationWarning:PIL",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
source = ["main_app"]
omit = [
    "main_app/core/*",
    "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
