[project]
name = "pdfnik-pdf-service"
version = "0.1.0"
description = "PDF generation and audio transcription service for PDFnik ecosystem"
requires-python = ">=3.13"

dependencies = [
    "fastapi==0.127.1",
    "uvicorn==0.40.0",
    "pillow==12.1.1",
    "reportlab==4.4.7",
    "faster-whisper==1.2.1",
    "yt-dlp==2026.3.3",
    "faststream[rabbit]==0.6.3",
    "pydantic==2.11.10",
    "pydantic-settings==2.11.0",
    "pdfnik-schemes @ git+https://github.com/Evil2997/PDFnik-Schemes@v1.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "coverage>=7.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["main_app"]

# ---------------------------------------------------------------------------
# uv
# ---------------------------------------------------------------------------

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "coverage>=7.6.0",
]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Показывать короткие трейсбэки, подавлять предупреждения от сторонних либ
filterwarnings = [
    "ignore::DeprecationWarning:reportlab",
    "ignore::DeprecationWarning:PIL",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
source = ["main_app"]
omit = [
    "main_app/core/*",       # константы и логгер — боилерплейт
    "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70