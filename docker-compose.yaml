services:
  pdf-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdf-service
    volumes:
      - files_storage:/data_files_storage
    env_file:
      - .env
#    command: ["python", "main.py"]
    command: ["sh", "-c", "sleep 5 && python main.py"]
    restart: unless-stopped

volumes:
  files_storage:
    name: files_storage
    external: true

networks:
  default:
    name: shared-net
    external: true
