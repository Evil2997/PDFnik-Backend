services:
  pdf-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdf-service
    env_file:
      - .env
    environment:
        RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//
    command: ["python", "main.py"]

networks:
  default:
    external: true
    name: shared-net
